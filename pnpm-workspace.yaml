packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

saveExact: true

catalog:
  '@types/node': ^24
  typescript: 6.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
