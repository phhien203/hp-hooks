name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24'
          cache: true
          run-install: true

      - name: Install Chromium
        run: vp exec --filter @hp-hooks/react -- playwright install --with-deps chromium

      - name: Build publishable library
        run: vp -C packages/react pack

      - name: Check code quality
        run: vp check

      - name: Run browser tests
        run: vp -C packages/react test

      - name: Build playground
        run: vp -C apps/playground build

      - name: Inspect publishable package
        working-directory: packages/react
        run: npm pack --dry-run
